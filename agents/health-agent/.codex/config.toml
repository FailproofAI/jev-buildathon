model = "gpt-5.6-luna"
# Codex's built-in metadata puts gpt-5.6-* in "code mode only": every MCP call is
# wrapped in a JavaScript `exec` tool, so hooks and FailproofAI Cloud never see
# mcp__<server>__<tool>. This catalog is the same metadata without that mode.
model_catalog_json = "../../../env/codex/models.json"
# Care only works through its MCP tools: no shell, no web, no file access.
web_search = "disabled"

[features]
shell_tool = false
# Call MCP tools directly (not through a JS "exec" wrapper), so hooks,
# policies and FailproofAI Cloud all see mcp__health__<tool> calls.
code_mode = false

[mcp_servers.health]
command = "node"
args = ["server.mjs"]
env_vars = ["BUILDATHON_RUN_ID"]
default_tools_approval_mode = "approve"
